<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Crossing Persia</title>
<meta name="description" content="A travel diary of a man crossing the Persian Empire around 500 BCE, one day at a time.">
<link rel="canonical" href="https://www.crossingpersia.com/">
<!-- the tab icon: the Old Persian sign pa, first sign of Parsa (Persia), white on dark blue -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<!-- the preview card when a link is shared on Facebook, WhatsApp, X and others -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Crossing Persia">
<meta property="og:title" content="Crossing Persia">
<meta property="og:description" content="A real-time Travel Journal in 500 BCE">
<meta property="og:url" content="https://www.crossingpersia.com/">
<meta property="og:image" content="https://www.crossingpersia.com/assets/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Crossing Persia: a real-time Travel Journal in 500 BCE, over the carved face of Darius with gold cuneiform">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="fonts/intertight-notonastaliqurdu-notosansoldpersian.css">
<link rel="stylesheet" href="cover.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Crossing Persia","url":"https://www.crossingpersia.com/","description":"A travel diary of a man crossing the Persian Empire around 500 BCE, one day at a time.","inLanguage":["en","prs","kmr"],"image":"https://www.crossingpersia.com/assets/share.jpg","sameAs":["https://crossingpersia.substack.com/"]}</script>
</head>
<body>

<!-- maps.html sits behind the cover. It loads quietly after the cover has drawn. -->
<iframe id="mapFrame" class="map-frame" title="Maps: Arion's journey so far" tabindex="-1" aria-hidden="true"
        data-src="maps.html"></iframe>

<main class="cover" id="cover">

  <!-- LEFT COLUMN: the red card wraps down around the curved corner of the photograph -->
  <section class="col col-left">
    <a class="card card-rust panel rise" style="--i:0" href="journal.html">
      <h2 class="panel-label"><span class="swap-stack" id="journalSwap"><span class="main">Travel Journal</span><span class="alt dari" lang="prs" dir="rtl">سفرنامه</span></span></h2>
      <span class="rust-leg" aria-hidden="true"></span>
    </a>

    <a class="card card-photo photo-fog panel rise" style="--i:3" href="maps.html">
      <img src="assets/zagros-fog.jpg" alt="" decoding="async">
      <div class="grade"></div>
      <!-- a six-petal rosette, the flower carved all over Persepolis -->
      <svg class="lineart lineart-rosette" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="92"/>
        <circle cx="100" cy="54" r="46"/>
        <circle cx="139.84" cy="77" r="46"/>
        <circle cx="139.84" cy="123" r="46"/>
        <circle cx="100" cy="146" r="46"/>
        <circle cx="60.16" cy="123" r="46"/>
        <circle cx="60.16" cy="77" r="46"/>
        <circle cx="100" cy="100" r="3" class="fill"/>
      </svg>
      <div class="gold-wash" aria-hidden="true"></div>
      <h2 class="panel-label photo-label"><span data-cunify>Maps</span></h2>
    </a>
  </section>

  <!-- MIDDLE COLUMN: a tall stone card with a round bite that holds the tablet -->
  <section class="col col-mid">
    <article class="card card-stone rise" style="--i:1">
      <div class="cuneiform-texture" aria-hidden="true"></div>
      <div class="stone-top">
        <h1><span data-cunify>Crossing</span> <span data-cunify>Persia</span></h1>
        <p class="today"><span data-cunify>Today</span> is <span id="today">18 November 500&nbsp;BCE</span></p>
        <p class="journey" id="journeyLine" hidden>It is <span class="red" id="dayNo">Day 1</span> of <span data-cunify>Arion&rsquo;s</span> <span data-cunify>Journey</span> to the <span class="swap-stack" id="empireSwap" data-cun><span class="main">Persian Empire</span><span class="alt opers" lang="peo" title="P&#257;rsa x&#353;a&#231;am">&#x103B1;&#x103A0;&#x103BC;&#x103BF; &#x103A7;&#x103C1;&#x103C2;&#x103B6;</span></span></p>
        <p class="where" id="whereLine"></p>
      </div>
    </article>

    <div class="disk" id="disk" role="button" tabindex="0" aria-label="Open the route map">
      <div class="disk-body">
        <div class="disk-dots"></div>
        <div class="disk-ink"><div class="disk-lines"></div></div>
        <div class="disk-glint"></div>
        <svg class="disk-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="48.6" pathLength="360"/>
        </svg>
        <div class="spots" id="spots" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- RIGHT COLUMN -->
  <section class="col col-right">
    <div class="card card-photo photo-darius rise" style="--i:2">
      <a class="panel panel-fill" href="https://crossingpersia.substack.com/" target="_blank" rel="noopener">
        <img src="assets/darius-mirror.jpg" alt="" decoding="async">
        <div class="grade"></div>
        <!-- the tablet's own writing, both sides, laid over the rock in gold -->
        <div class="tablet-gold" id="tabletGold" aria-hidden="true"></div>
        <div class="gold-wash" aria-hidden="true"></div>
        <h2 class="panel-label photo-label substack-label"><span data-cunify>Substack</span></h2>
      </a>
    </div>

    <div class="notch">
      <a class="card card-paper panel rise" style="--i:4" href="about.html">
        <h2 class="panel-label"><span data-cunify>About</span> the <span data-cunify>Project</span></h2>
      </a>
    </div>
  </section>
</main>

<script src="cover.js"></script>
</body>
</html>
