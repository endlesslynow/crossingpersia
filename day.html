<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Crossing Persia</title>
<meta name="description" content="One day of Arion's journey, in English, Dari and Kurmanji.">
<!-- the tab icon: the Old Persian sign pa, first sign of Parsa (Persia), white on dark blue -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<!-- the diary as a feed, for people who follow sites in a feed reader -->
<link rel="alternate" type="application/rss+xml" title="Crossing Persia" href="https://crossingpersia.substack.com/feed">
<!-- the preview card when a link is shared on Facebook, WhatsApp, X and others -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Crossing Persia">
<meta property="og:title" content="Crossing Persia">
<meta property="og:description" content="One day of Arion's journey, in English, Dari and Kurmanji.">
<meta property="og:image" content="https://www.crossingpersia.com/assets/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Crossing Persia: a real-time Travel Journal in 500 BCE, over the carved face of Darius with gold cuneiform">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="fonts/librebaskerville-ebgaramond.css">
<!-- Vazirmatn, the Dari letters of the reader -->
<link rel="stylesheet" href="reader/css/font.css">
<link rel="stylesheet" href="css/day.css?v=6">
</head>
<body>

<a class="back" href="journal.html" aria-label="Back to the Travel Journal">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
</a>

<main class="day" id="day">

  <!-- the day's picture across the top of the card; day.js fills it in -->
  <figure class="hero"><img id="hero-img" alt=""></figure>

  <header class="head">
    <p class="when" id="when"></p>
    <h1 class="title" id="title"></h1>
    <!-- the three languages -->
    <nav class="langs" aria-label="Language">
      <button type="button" data-lang="en">English</button>
      <i aria-hidden="true">◆</i>
      <button type="button" data-lang="fa" lang="prs" dir="rtl">دری</button>
      <i aria-hidden="true">◆</i>
      <button type="button" data-lang="kmr" lang="ku">Kurdî</button>
      <!-- the map of the journey, opened in a new tab -->
      <a class="map-link" href="maps.html" target="_blank" rel="noopener">Map</a>
    </nav>
  </header>

  <!-- the Dari story read aloud -->
  <div id="player" class="player" hidden>
    <button type="button" id="rewind" class="rewind" aria-label="Back one second">
      <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-5.7 7.9l1.9-.6A4 4 0 1 0 5 5.2L7 7H1V1l2.5 2.5A6 6 0 0 1 8 2z" fill="currentColor"/></svg>
      <span>۱</span>
    </button>
    <button type="button" id="play" class="play" aria-label="Play the story (space bar)">
      <svg class="i-play" viewBox="0 0 16 16"><path d="M4 2l10 6l-10 6z" fill="currentColor"/></svg>
      <svg class="i-pause" viewBox="0 0 16 16"><path d="M4 2h3v12H4zm5 0h3v12H9z" fill="currentColor"/></svg>
    </button>
    <div id="track" class="track" role="slider" aria-label="Where in the story"><i id="track-fill"></i></div>
    <span id="clock" class="clock"></span>
    <div id="volume" class="volume" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="1" aria-valuemax="10">
      <svg viewBox="0 0 16 16"><path d="M1.5 6h3l4-3.2v10.4l-4-3.2h-3z" fill="currentColor"/><path d="M11 5.4a3.6 3.6 0 0 1 0 5.2M12.8 3.6a6.2 6.2 0 0 1 0 8.8" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      <span id="volbars" class="volbars"></span>
      <b id="volnum" class="volnum"></b>
    </div>
    <a id="download" class="download" download aria-label="Download the recording">
      <svg viewBox="0 0 16 16"><path d="M7 1h2v7.2l2.6-2.6 1.4 1.4L8 12 3 7l1.4-1.4L7 8.2zM2 13h12v2H2z" fill="currentColor"/></svg>
      <span>دانلود صدا</span>
    </a>
    <audio id="audio" preload="metadata"></audio>
  </div>

  <!-- the story: English as plain text; Dari and Kurmanji with a word's meaning on a click -->
  <article id="paper" class="paper">
    <div id="story"></div>
    <div id="slip" class="slip" role="status" hidden></div>
  </article>

  <!-- the diary by email. The address typed here arrives already filled in on Substack's own page -->
  <form class="signup" action="https://crossingpersia.substack.com/subscribe" method="get" target="_blank" rel="noopener">
    <label for="signup-email">Get Arion&rsquo;s journal by email every day, free</label>
    <div class="signup-row">
      <input id="signup-email" name="email" type="email" required autocomplete="email" placeholder="Your email">
      <button type="submit">Subscribe</button>
    </div>
  </form>

  <!-- the picture's caption, credit and the sources, in English under every version -->
  <footer class="notes" id="notes"></footer>

  <nav class="days" id="days" aria-label="Other days"></nav>
</main>

<script>var READINGS = [];</script>
<script src="data/articles.js"></script>
<script src="js/day.js?v=5"></script>
<script src="js/count.js"></script>
</body>
</html>
